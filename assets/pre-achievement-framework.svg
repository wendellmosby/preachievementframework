<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <defs>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #17375E; }
      .subtitle { font-size: 14px; font-weight: 400; fill: #334155; }
      .center-title { font-size: 16px; font-weight: 700; fill: #17375E; text-anchor: middle; }
      .center-sub { font-size: 11px; font-weight: 500; fill: #2A9D8F; text-anchor: middle; }
      .node-title { font-size: 14px; font-weight: 700; fill: #17375E; }
      .node-body { font-size: 11px; fill: #334155; line-height: 1.3; }
      .panel-header { font-size: 13px; font-weight: 700; fill: #17375E; }
      .panel-text { font-size: 11px; fill: #334155; }
      .bold-highlight { font-weight: 700; fill: #17375E; }
      .list-is { font-size: 10.5px; fill: #17375E; font-weight: 600; }
      .list-not { font-size: 10.5px; fill: #991B1B; font-weight: 500; }
      .banner-title { font-size: 14px; font-weight: 700; fill: #D9A441; }
      .banner-text { font-size: 12px; fill: #FFFFFF; font-weight: 400; }
      .footnote { font-size: 10.5px; font-style: italic; fill: #64748B; text-anchor: middle; }
    </style>
    
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="860" fill="#FFFFFF"/>

  <g transform="translate(40, 40)">
    <text x="0" y="0" class="title">Figure 3. The Pre-Achievement Framework</text>
    <text x="0" y="22" class="subtitle">An observational lens for recognizing learner behaviors that may become visible while learning is still developing</text>
  </g>

  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="1120" height="425" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <path d="M 0,12 A 12,12 0 0,1 12,0 L 1108,0 A 12,12 0 0,1 1120,12 L 1120,34 L 0,34 Z" fill="#17375E"/>
    <text x="560" y="22" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5" text-anchor="middle">WHAT EDUCATORS MAY NOTICE</text>
    
    <rect x="120" y="44" width="880" height="28" rx="6" fill="#E6F4F1" stroke="#2A9D8F" stroke-width="1"/>
    <text x="560" y="62" font-size="11.5" font-weight="500" fill="#17375E" text-anchor="middle">
      These behaviors may provide educators with information about how students are engaging with learning before changes appear in traditional measures of achievement.
    </text>

    <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="560" y1="245" x2="280" y2="155"/>
      <line x1="560" y1="245" x2="560" y2="150"/>
      <line x1="560" y1="245" x2="840" y2="155"/>
      <line x1="560" y1="245" x2="840" y2="335"/>
      <line x1="560" y1="245" x2="560" y2="340"/>
      <line x1="560" y1="245" x2="280" y2="335"/>
    </g>

    <g transform="translate(560, 245)">
      <circle r="85" fill="#FFFFFF" stroke="#17375E" stroke-width="2.5" filter="url(#card-shadow)"/>
      <circle r="78" fill="none" stroke="#2A9D8F" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="0" y="-18" class="center-title">Observable</text>
      <text x="0" y="2" class="center-title">Pre-Achievement</text>
      <text x="0" y="22" class="center-title">Behaviors</text>
      <text x="0" y="44" class="center-sub">Central Focus</text>
    </g>

    <g transform="translate(420, 95)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="280" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="75" rx="3" fill="#2A9D8F"/>
      <text x="18" y="24" class="node-title">Beginning</text>
      <text x="18" y="44" class="node-body">The learner initiates academic work despite</text>
      <text x="18" y="59" class="node-body">uncertainty or hesitation.</text>
    </g>

    <g transform="translate(730, 125)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="280" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="75" rx="3" fill="#2A9D8F"/>
      <text x="18" y="24" class="node-title">Asking Questions</text>
      <text x="18" y="44" class="node-body">The learner seeks clarification, feedback,</text>
      <text x="18" y="59" class="node-body">information, or deeper understanding.</text>
    </g>

    <g transform="translate(730, 295)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="280" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="75" rx="3" fill="#2A9D8F"/>
      <text x="18" y="24" class="node-title">Persisting</text>
      <text x="18" y="44" class="node-body">The learner continues working through difficulty</text>
      <text x="18" y="59" class="node-body">or identifies another resource when needed.</text>
    </g>

    <g transform="translate(420, 325)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="280" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="75" rx="3" fill="#2A9D8F"/>
      <text x="18" y="24" class="node-title">Revising</text>
      <text x="18" y="44" class="node-body">The learner returns to improve work after</text>
      <text x="18" y="59" class="node-body">feedback, error, or reflection.</text>
    </g>

    <g transform="translate(110, 295)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="280" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="75" rx="3" fill="#2A9D8F"/>
      <text x="18" y="24" class="node-title">Taking Ownership</text>
      <text x="18" y="44" class="node-body">The learner demonstrates increasing responsibility</text>
      <text x="18" y="59" class="node-body">for progress, resources, feedback, or next steps.</text>
    </g>

    <g transform="translate(110, 125)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="280" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="75" rx="3" fill="#2A9D8F"/>
      <text x="18" y="24" class="node-title">Helping Others</text>
      <text x="18" y="44" class="node-body">The learner contributes to classmates' learning through</text>
      <text x="18" y="59" class="node-body">explanation, encouragement, collaboration, or modeling.</text>
    </g>
  </g>

  <g transform="translate(40, 525)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="350" height="190" rx="8" fill="#FFFFFF" stroke="#D9A441" stroke-width="1.5"/>
    <path d="M 0,8 A 8,8 0 0,1 8,0 L 342,0 A 8,8 0 0,1 350,8 L 350,30 L 0,30 Z" fill="#FEF3C7"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#B45309">RELATIONSHIP TO ACHIEVEMENT</text>
    
    <text x="16" y="52" class="bold-highlight" font-size="11.5">The framework complements traditional</text>
    <text x="16" y="68" class="bold-highlight" font-size="11.5">measures of achievement; it does not replace them.</text>
    
    <line x1="16" y1="82" x2="334" y2="82" stroke="#FDE68A" stroke-width="1"/>
    
    <rect x="16" y="96" width="318" height="76" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
    <text x="28" y="120" font-size="11" font-weight="700" fill="#92400E">Mastery Distinction:</text>
    <text x="28" y="138" class="panel-text" font-size="11">Recognizing a Pre-Achievement Behavior is</text>
    <text x="28" y="154" class="panel-text" font-size="11" font-weight="600" fill="#B45309">not the same as demonstrating mastery.</text>
  </g>

  <g transform="translate(410, 525)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="380" height="190" rx="8" fill="#FFFFFF" stroke="#17375E" stroke-width="1.5"/>
    <path d="M 0,8 A 8,8 0 0,1 8,0 L 372,0 A 8,8 0 0,1 380,8 L 380,30 L 0,30 Z" fill="#17375E"/>
    <text x="190" y="20" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">FRAMEWORK BOUNDARIES</text>
    
    <line x1="190" y1="40" x2="190" y2="175" stroke="#E2E8F0" stroke-width="1"/>

    <text x="12" y="48" font-size="11" font-weight="700" fill="#2A9D8F">WHAT THE FRAMEWORK IS</text>
    <text x="12" y="68" class="list-is">• Practitioner-developed conceptual</text>
    <text x="21" y="82" class="list-is">framework</text>
    <text x="12" y="100" class="list-is">• An observational lens</text>
    <text x="12" y="118" class="list-is">• Language for noticing learner</text>
    <text x="21" y="132" class="list-is">engagement</text>
    <text x="12" y="150" class="list-is">• Invitation for professional inquiry</text>
    
    <text x="202" y="48" font-size="11" font-weight="700" fill="#DC2626">WHAT IT IS NOT</text>
    <text x="202" y="68" class="list-not">• A diagnostic tool</text>
    <text x="202" y="88" class="list-not">• A validated assessment instrument</text>
    <text x="202" y="108" class="list-not">• A predictive or causal model</text>
    <text x="202" y="128" class="list-not">• A student checklist</text>
    <text x="202" y="148" class="list-not">• A fixed sequence of stages</text>
  </g>

  <g transform="translate(810, 525)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="350" height="190" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 0,8 A 8,8 0 0,1 8,0 L 342,0 A 8,8 0 0,1 350,8 L 350,30 L 0,30 Z" fill="#E2E8F0"/>
    
    <rect x="16" y="8" width="14" height="14" rx="2" fill="#94A3B8"/>
    <text x="23" y="18" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI</text>
    
    <text x="38" y="20" font-size="12" font-weight="700" fill="#334155">RELATIONSHIP TO AI</text>
    
    <text x="16" y="52" class="bold-highlight" font-size="11.5">The Pre-Achievement Framework is not an</text>
    <text x="16" y="68" class="bold-highlight" font-size="11.5">AI framework.</text>
    
    <text x="16" y="94" class="panel-text">Artificial intelligence was one educational support</text>
    <text x="16" y="110" class="panel-text">within the classroom context in which some of</text>
    <text x="16" y="126" class="panel-text">these behaviors became easier to notice.</text>
    
    <rect x="16" y="142" width="318" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="163" font-size="10.5" font-style="italic" fill="#64748B">AI provided context—not causation.</text>
  </g>

  <g transform="translate(40, 730)">
    <rect x="0" y="0" width="1120" height="52" rx="6" fill="#17375E"/>
    <text x="24" y="22" class="banner-title">CORE INSIGHT</text>
    <text x="24" y="40" class="banner-text">
      The Pre-Achievement Framework expands what educators notice before achievement becomes measurable. It does not determine what those behaviors will ultimately produce.
    </text>
  </g>

  <text x="600" y="810" class="footnote">
    Note: The six behaviors emerged from practitioner observations in one sixth-grade Social Studies classroom. The framework has not been validated, and relationships between these behaviors and later academic outcomes have not been established.
  </text>

</svg>
